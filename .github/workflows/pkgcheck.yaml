# rOpenSci pre-submission checks
# https://github.com/ropensci-review-tools/pkgcheck-action
# Run manually (Actions > pkgcheck > Run workflow) once R-CMD-check and
# test-coverage are green: pkgcheck counts still-running checks as failures.
name: pkgcheck

on:
  workflow_dispatch:

jobs:
  pkgcheck:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: ropensci-review-tools/pkgcheck-action@main
